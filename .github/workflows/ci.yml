name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The parent chain (super-pom -> learning-bom) is not published to Maven Central,
      # so check both out and install them into the runner's local repository first.
      - uses: actions/checkout@v4
        with:
          repository: himnay/learning-bom
          path: learning-bom
      - uses: actions/checkout@v4
        with:
          repository: himnay/super-pom
          path: super-pom
      - uses: actions/checkout@v4
        with:
          path: learning-code
      - uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      - name: Install learning-bom
        run: mvn -B -N install
        working-directory: learning-bom
      - name: Install super-pom
        run: mvn -B -N install
        working-directory: super-pom
      - name: Build and test
        run: mvn -B verify
        working-directory: learning-code
      # The reports matter most when a test fails, so build and upload them regardless.
      - name: Allure report
        if: always()
        run: mvn -B allure:report
        working-directory: learning-code
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            learning-code/target/test-graph/index.html
            learning-code/target/site/allure-maven-plugin/index.html
